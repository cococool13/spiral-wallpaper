name: release-slim

# Spiral Slim releases on a `slim-v*` tag, so the two apps in this repo can be
# released independently. A bare `v*` still belongs to Spiral Wallpaper.
#
#   git tag slim-v1.0.1 && git push origin slim-v1.0.1
#
# macOS only, and updater off, matching what Slim already commits to:
# apps/slim/desktop/README.md records "no auto-updater" as a decision — adding
# one means adding a second trust root — and no Windows or Linux binary, with
# apps/slim/CLAUDE.md repeating it as a rule.
#
# The shared workflow does support Windows. Turning it on here is a product and
# security decision, not a config change: it means publishing a compiled
# artifact for a tool that writes system policy, and the two documents above
# have to say so first.

on:
  push:
    tags: ["slim-v*"]
  workflow_dispatch:

# One run per ref. Without this, two runs can exist for the same tag and both
# reach `publish`, racing to create the same GitHub Release — which is exactly
# what happened to v1.0.3 on 2026-08-06, when a dispatched run and a
# late-firing push run appeared 21 seconds apart.
#
# `cancel-in-progress` is true for branches and pull requests, where a newer
# push makes an older run pointless, and **false for tags**: cancelling a
# release part-way through publishing is a worse outcome than the duplicate.
# A second tag run instead queues behind the first and then fails loudly at
# `publish` because the release already exists, which is a clear answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  release:
    # Without this the workflow does not merely fail — it never starts. A
    # called workflow cannot hold more than its caller was granted, this
    # repository defaults the token to read, and the shared workflow's publish
    # job needs `contents: write` to create the release. Omitting it here would
    # have made Slim's very first tag a startup failure with no job to inspect.
    permissions:
      contents: write
    uses: ./.github/workflows/release-app.yml
    secrets: inherit
    with:
      app-dir: apps/slim/desktop
      artifact-prefix: slim
      macos: true
      windows: false
      updater: false
